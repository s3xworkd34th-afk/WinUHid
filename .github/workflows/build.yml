name: Build WinUHid

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build WinUHid
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        configuration: [Release]
        platform: [x64]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2
      with:
        msbuild-architecture: x64

    - name: Restore NuGet packages
      run: msbuild "WinUHid Driver/WinUHid Driver.vcxproj" /t:Restore /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }}

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11

    - name: Install vcpkg MSBuild integration
      run: ${{ github.workspace }}/vcpkg/vcpkg.exe integrate install

    - name: Find VHF library
      shell: pwsh
      run: |
        $roots = @(
          "$env:USERPROFILE\.nuget\packages",
          "$env:GITHUB_WORKSPACE\packages",
          "${env:ProgramFiles(x86)}\Windows Kits\10"
        )
        $found = @(
          foreach ($root in $roots) {
            if (Test-Path $root) {
              Get-ChildItem -Path $root -Filter VhfUm.lib -Recurse -File -ErrorAction SilentlyContinue
            }
          }
        )
        if ($found.Count -eq 0) {
          Write-Error "VhfUm.lib was not found in the checked locations."
          exit 1
        }
        $found | ForEach-Object { Write-Host "Found: $($_.FullName)" }
        "LIB=$($found[0].DirectoryName);$env:LIB" >> $env:GITHUB_ENV

    - name: Build solution
      run: msbuild "WinUHid Driver/WinUHid Driver.vcxproj" /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }} /m /verbosity:minimal

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: WinUHid-${{ matrix.configuration }}-${{ matrix.platform }}
        path: |
          build/${{ matrix.configuration }}/${{ matrix.platform }}/WinUHid.*
          WinUHid/WinUHid.h
